# Local chat generation via LM Studio's OpenAI-compatible server, for trying a real generated answer
# without a paid API key. Opt-in only — see TestSecureRagJavaApplication's LM_STUDIO flag; this profile
# is never active by itself and never affects the automated test suite.
#
# Sets its own embedding override (transformers/local ONNX) instead of relying on the "test" profile,
# so the properties here are self-sufficient regardless of what other profiles are combined with it.
# LM Studio's Nomic Embed model outputs 768 dimensions, incompatible with this project's fixed
# 384-dimension vector_store schema, hence embeddings stay on the local ONNX model here too.
#
# base-url and model are environment-overridable, not hardcoded to one machine's setup: a model alias
# assigned in LM Studio's UI can disappear (e.g. the model unloads on its idle timeout and the alias
# goes with it), so the default here is the model's own stable id, not a personal display name. Check
# `curl http://127.0.0.1:1234/v1/models` for what's actually loaded before relying on the default.
spring.ai.model.chat=openai
spring.ai.model.embedding=transformers
spring.ai.openai.base-url=${LMSTUDIO_BASE_URL:http://127.0.0.1:1234/v1}
spring.ai.openai.api-key=not-used-by-lm-studio
spring.ai.openai.chat.options.model=${LMSTUDIO_MODEL:qwen3-coder-30b-a3b-it-heretic-i1}
