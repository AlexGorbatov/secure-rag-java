services:
  pgvector:
    image: 'pgvector/pgvector:pg17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432'

  # Local identity provider: dev mode, embedded storage inside the container, realm imported on start.
  # Admin console: http://localhost:8180 (admin / admin — local only).
  keycloak:
    image: 'quay.io/keycloak/keycloak:26.7.4'
    command: ['start-dev', '--import-realm']
    environment:
      - 'KC_BOOTSTRAP_ADMIN_USERNAME=admin'
      - 'KC_BOOTSTRAP_ADMIN_PASSWORD=admin'
      - 'KC_HEALTH_ENABLED=true'
      - 'KC_HTTP_PORT=8180'
    volumes:
      - './keycloak/securerag-realm.json:/opt/keycloak/data/import/securerag-realm.json:ro'
    # Fixed port: the token's "iss" must equal the issuer-uri the application validates against.
    ports:
      - '8180:8180'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
