spring.application.name=secure-rag-java

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.ai.vectorstore.pgvector.initialize-schema=false

# Only the models this application uses. Everything else from the OpenAI starter stays off,
# so no bean is created that needs credentials we never use.
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# No default: the application must fail at startup when the key is missing.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# JWT resource server. Defaults point at the Keycloak realm from compose.yaml;
# override for Entra ID or any other issuer. The token's "iss" must match exactly.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8180/realms/securerag}
spring.security.oauth2.resourceserver.jwt.audiences=${OAUTH2_AUDIENCE:securerag-api}

# Where entitlements live in the token (defaults: Keycloak). For Entra ID: SECURERAG_CLAIMS_ROLES=roles
securerag.security.claims.username=${SECURERAG_CLAIMS_USERNAME:preferred_username}
securerag.security.claims.groups=${SECURERAG_CLAIMS_GROUPS:groups}
securerag.security.claims.roles=${SECURERAG_CLAIMS_ROLES:realm_access.roles}

# OpenAPI document (/v3/api-docs) and Swagger UI (/swagger-ui.html). Public, so switch off where
# the API surface should not be advertised.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.oauth.client-id=${OPENAPI_OAUTH_CLIENT_ID:securerag-web}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# Login endpoints for Swagger UI. Defaults follow Keycloak's layout under the issuer; for Entra ID set
# https://login.microsoftonline.com/<tenant>/oauth2/v2.0/authorize and .../token.
securerag.openapi.authorization-url=${OPENAPI_AUTHORIZATION_URL:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/auth}
securerag.openapi.token-url=${OPENAPI_TOKEN_URL:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}

# Embedding dimension: 384 in every profile, fixed by V2__create_vector_store.sql. The local ONNX model
# (all-MiniLM-L6-v2) outputs 384; text-embedding-3-* models are asked for 384 instead of 1536.
# schema-validation checks at startup that the table's vector column has exactly this dimension.
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.openai.embedding.model=text-embedding-3-small
spring.ai.openai.embedding.dimensions=384

# Uploads. The multipart limit rejects big files before they are read; the text limit is enforced while
# parsing, so a small file that expands into a huge amount of text is stopped too.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
securerag.ingestion.max-text-characters=2000000
securerag.ingestion.max-title-length=255
# Tokens per chunk. The local ONNX model (all-MiniLM-L6-v2) reads at most 256 word pieces, so chunks stay
# well below that to be embedded in full in every profile.
securerag.ingestion.chunk-size-tokens=200
