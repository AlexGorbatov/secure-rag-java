spring.application.name=secure-rag-java

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.ai.vectorstore.pgvector.initialize-schema=false

# Only the models this application uses. Everything else from the OpenAI starter stays off,
# so no bean is created that needs credentials we never use.
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# No default: the application must fail at startup when the key is missing.
spring.ai.openai.api-key=${OPENAI_API_KEY}
