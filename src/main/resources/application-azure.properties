# Azure OpenAI through the unified OpenAI starter (Spring AI 2.x has no separate Azure module).
# Activate with --spring.profiles.active=azure.
spring.ai.openai.microsoft-foundry=true
spring.ai.openai.base-url=${AZURE_OPENAI_ENDPOINT}
spring.ai.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.openai.chat.microsoft-deployment-name=${AZURE_OPENAI_CHAT_DEPLOYMENT}
spring.ai.openai.embedding.microsoft-deployment-name=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT}
# The embedding deployment must be a text-embedding-3-* model: it is asked for 384 dimensions
# (spring.ai.openai.embedding.dimensions in application.properties), which older models ignore.
