# Microsoft Entra ID instead of Keycloak. Activate with --spring.profiles.active=entra (combine with
# azure if the models are on Azure too: --spring.profiles.active=azure,entra).
#
# In Entra ID: register an app for this API, expose it (Application ID URI), define app role "user",
# and add the "groups" claim to access tokens (Token configuration). Entra puts group object IDs (GUIDs)
# into "groups", not names, so documents are shared by group ID under this profile.
#
# Two things that otherwise end in a puzzling 401 or missing documents:
# - Set "accessTokenAcceptedVersion": 2 in the API app's manifest. Without it Entra issues v1 tokens
#   whose issuer is https://sts.windows.net/<tenant>/, which does not match the v2 issuer below.
# - A user in more than 200 groups gets no "groups" claim (Entra sends a Graph API reference instead).
#   The application then resolves no groups: that user sees only their own documents, never more.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_API_AUDIENCE}
securerag.security.claims.roles=roles

# Swagger UI login against Entra ID (a public SPA/native client registration with PKCE).
securerag.openapi.authorization-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/authorize
securerag.openapi.token-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/oauth2/v2.0/token
springdoc.swagger-ui.oauth.client-id=${ENTRA_SWAGGER_CLIENT_ID}
